</style>
<rect class="bg" width="1640" height="1758"/>
<rect x="590.0" y="40" width="460" height="92" rx="16" class="root"/>
<text x="820.0" y="86" class="rtitle" text-anchor="middle">MAHORAGA</text>
<text x="820.0" y="112" class="rsub" text-anchor="middle">one WhatsApp number · four chat bots · a personal assistant</text>
<line x1="820.0" y1="132" x2="820.0" y2="166" class="edge"/>
<rect x="560.0" y="166" width="520" height="228" rx="12" class="card"/>
<rect x="560.0" y="166" width="520" height="6" rx="3" fill="#8b9cff"/>
<text x="576.0" y="196" class="ctitle" text-anchor="start">Common commands</text>
<text x="576.0" y="214" class="csub" text-anchor="start">every chat bot answers these · a chat's bot is set by the owner with !add / !edit</text>
<text x="576.0" y="241" class="cmd" fill="#8b9cff">!help</text>
<text x="588.0" y="258" class="desc" text-anchor="start">this chat's bot commands (12-min cooldown per chat)</text>
<text x="576.0" y="281" class="cmd" fill="#8b9cff">!hello</text>
<text x="588.0" y="298" class="desc" text-anchor="start">check the bot is alive</text>
<text x="576.0" y="321" class="cmd" fill="#8b9cff">!reset</text>
<text x="588.0" y="338" class="desc" text-anchor="start">forget this chat's conversation context</text>
<text x="576.0" y="361" class="cmd" fill="#8b9cff">!&lt;question&gt;</text>
<text x="588.0" y="378" class="desc" text-anchor="start">ask the chat's bot anything in its domain</text>
<line x1="820.0" y1="394" x2="820.0" y2="454" class="edge"/>
<text x="832.0" y="428" class="lane" text-anchor="start">prefix  !   ·   routed to the bot assigned to the chat</text>
<line x1="220.0" y1="454" x2="1420.0" y2="454" class="edge"/>
<line x1="220.0" y1="454" x2="220.0" y2="494" class="edge"/>
<rect x="30.0" y="494" width="380.0" height="250" rx="12" class="card"/>
<rect x="30.0" y="494" width="380.0" height="6" rx="3" fill="#5fd4a4"/>
<text x="46.0" y="524" class="ctitle" text-anchor="start">Bot 0 · Generic</text>
<text x="46.0" y="542" class="csub" text-anchor="start">default slot · owner's personal DMs</text>
<text x="46.0" y="569" class="cmd" fill="#5fd4a4">!chat &lt;text&gt;</text>
<text x="58.0" y="586" class="desc" text-anchor="start">short small talk while the owner is away</text>
<text x="46.0" y="609" class="cmd" fill="#5fd4a4">(plain DM)</text>
<text x="58.0" y="626" class="desc" text-anchor="start">away greeting + laptop toast to the owner</text>
<text x="46.0" y="650" class="sect" text-anchor="start">NOTES</text>
<text x="46.0" y="671" class="cmd" fill="#5fd4a4">5 replies / 4 h</text>
<text x="58.0" y="688" class="desc" text-anchor="start">per number; also answers !chat in bot 1–3 chats</text>
<text x="46.0" y="711" class="cmd" fill="#5fd4a4">OFF by default</text>
<text x="58.0" y="728" class="desc" text-anchor="start">GENERIC_AUTORESPONDER_ENABLED=false (Sep 26)</text>
<line x1="620.0" y1="454" x2="620.0" y2="494" class="edge"/>
<rect x="430.0" y="494" width="380.0" height="188" rx="12" class="card"/>
<rect x="430.0" y="494" width="380.0" height="6" rx="3" fill="#f2b35a"/>
<text x="446.0" y="524" class="ctitle" text-anchor="start">Bot 1 · ECB</text>
<text x="446.0" y="542" class="csub" text-anchor="start">EmbedClub · default for new !add</text>
<text x="446.0" y="569" class="cmd" fill="#f2b35a">!projects</text>
<text x="458.0" y="586" class="desc" text-anchor="start">ECB projects grouped by status</text>
<text x="446.0" y="609" class="cmd" fill="#f2b35a">!events</text>
<text x="458.0" y="626" class="desc" text-anchor="start">upcoming ECB events</text>
<text x="446.0" y="649" class="cmd" fill="#f2b35a">!deadlines</text>
<text x="458.0" y="666" class="desc" text-anchor="start">upcoming deadlines</text>
<line x1="1020.0" y1="454" x2="1020.0" y2="494" class="edge"/>
<rect x="830.0" y="494" width="380.0" height="450" rx="12" class="card"/>
<rect x="830.0" y="494" width="380.0" height="6" rx="3" fill="#ff7f9b"/>
<text x="846.0" y="524" class="ctitle" text-anchor="start">Bot 2 · DKB</text>
<text x="846.0" y="542" class="csub" text-anchor="start">DK24 · Developer Kommunity 24, Mangaluru</text>
<text x="846.0" y="569" class="cmd" fill="#ff7f9b">!clubs  ·  !club &lt;name&gt;</text>
<text x="858.0" y="586" class="desc" text-anchor="start">member communities / one club's card</text>
<text x="846.0" y="609" class="cmd" fill="#ff7f9b">!events [may-2026]  ·  !event &lt;name&gt;</text>
<text x="858.0" y="626" class="desc" text-anchor="start">calendar from dk24.org, cached by hash</text>
<text x="846.0" y="649" class="cmd" fill="#ff7f9b">!projects  ·  !project &lt;name&gt;</text>
<text x="858.0" y="666" class="desc" text-anchor="start">community projects + tech stack</text>
<text x="846.0" y="689" class="cmd" fill="#ff7f9b">!mentors [page]</text>
<text x="858.0" y="706" class="desc" text-anchor="start">alphabetical, 20 per page</text>
<text x="846.0" y="729" class="cmd" fill="#ff7f9b">!mentor -id &lt;id&gt;  ·  -f &lt;query&gt;</text>
<text x="858.0" y="746" class="desc" text-anchor="start">one mentor / filter by name</text>
<text x="846.0" y="769" class="cmd" fill="#ff7f9b">!next  ·  !page &lt;n&gt;</text>
<text x="858.0" y="786" class="desc" text-anchor="start">paginate the last listing</text>
<text x="846.0" y="810" class="sect" text-anchor="start">MENTOR ROLE ONLY</text>
<text x="846.0" y="831" class="cmd" fill="#ff7f9b">!addmentor -n .. -o ..</text>
<text x="858.0" y="848" class="desc" text-anchor="start">add a mentor</text>
<text x="846.0" y="871" class="cmd" fill="#ff7f9b">!editmentor -id &lt;id&gt; -&lt;flag&gt; &lt;v&gt;</text>
<text x="858.0" y="888" class="desc" text-anchor="start">update a field</text>
<text x="846.0" y="911" class="cmd" fill="#ff7f9b">!rmmentor -id &lt;id&gt;</text>
<text x="858.0" y="928" class="desc" text-anchor="start">remove (alias !delmentor)</text>
<line x1="1420.0" y1="454" x2="1420.0" y2="494" class="edge"/>
<rect x="1230.0" y="494" width="380.0" height="148" rx="12" class="card"/>
<rect x="1230.0" y="494" width="380.0" height="6" rx="3" fill="#6fc3ff"/>
<text x="1246.0" y="524" class="ctitle" text-anchor="start">Bot 3 · PARAG</text>
<text x="1246.0" y="542" class="csub" text-anchor="start">tech + hackathon assistant</text>
<text x="1246.0" y="569" class="cmd" fill="#6fc3ff">!&lt;question&gt;</text>
<text x="1258.0" y="586" class="desc" text-anchor="start">code, APIs, debugging, MVPs, pitches</text>
<text x="1246.0" y="609" class="cmd" fill="#6fc3ff">(anything else)</text>
<text x="1258.0" y="626" class="desc" text-anchor="start">politely refused, redirected to tech</text>
<path d="M560.0 280.0 H16 V1014 H286.6666666666667" class="edge"/>
<text x="42" y="1000" class="lane" text-anchor="start">owner only   ·   ADMIN_JIDS</text>
<line x1="286.6666666666667" y1="1014" x2="1353.3333333333335" y2="1014" class="edge"/>
<line x1="286.6666666666667" y1="1014" x2="286.6666666666667" y2="1054" class="edge"/>
<rect x="30.0" y="1054" width="513.3333333333334" height="592" rx="12" class="card"/>
<rect x="30.0" y="1054" width="513.3333333333334" height="6" rx="3" fill="#c49bff"/>
<text x="46.0" y="1084" class="ctitle" text-anchor="start">SELF · personal assistant</text>
<text x="46.0" y="1102" class="csub" text-anchor="start">prefix !! · owner only · any chat</text>
<text x="46.0" y="1129" class="cmd" fill="#c49bff">!!&lt;question&gt;  [-img]</text>
<text x="58.0" y="1146" class="desc" text-anchor="start">ask anything, optional reference image</text>
<text x="46.0" y="1169" class="cmd" fill="#c49bff">!!search &lt;query&gt;</text>
<text x="58.0" y="1186" class="desc" text-anchor="start">live web search (multi-provider RAG)</text>
<text x="46.0" y="1209" class="cmd" fill="#c49bff">!!explain &lt;topic&gt;  ·  !!howdoes &lt;x&gt;</text>
<text x="58.0" y="1226" class="desc" text-anchor="start">answers from the bot's own docs</text>
<text x="46.0" y="1250" class="sect" text-anchor="start">REMINDERS &amp; CALENDAR</text>
<text x="46.0" y="1271" class="cmd" fill="#c49bff">!!remind &lt;time&gt; &lt;msg&gt;</text>
<text x="58.0" y="1288" class="desc" text-anchor="start">e.g. !!remind in 5 minutes call John</text>
<text x="46.0" y="1311" class="cmd" fill="#c49bff">!!reminders  ·  !!delremind &lt;id&gt;</text>
<text x="58.0" y="1328" class="desc" text-anchor="start">list / delete</text>
<text x="46.0" y="1351" class="cmd" fill="#c49bff">!!gcal -t .. -sd ..  ·  !!gcal list</text>
<text x="58.0" y="1368" class="desc" text-anchor="start">Google Calendar event</text>
<text x="46.0" y="1392" class="sect" text-anchor="start">WORKING WITH A CHAT</text>
<text x="46.0" y="1413" class="cmd" fill="#c49bff">!!translate &lt;lang&gt; &lt;text&gt;  ·  all &lt;lang&gt;</text>
<text x="58.0" y="1430" class="desc" text-anchor="start">text, a reply, or a whole thread</text>
<text x="46.0" y="1453" class="cmd" fill="#c49bff">!!context  ·  !!summarize  ·  !!tldr [n]</text>
<text x="58.0" y="1470" class="desc" text-anchor="start">summarise a thread / last n msgs</text>
<text x="46.0" y="1493" class="cmd" fill="#c49bff">!!tone  ·  !!find &lt;keyword&gt;</text>
<text x="58.0" y="1510" class="desc" text-anchor="start">tone of a reply / search history</text>
<text x="46.0" y="1533" class="cmd" fill="#c49bff">!!reply &lt;style&gt;</text>
<text x="58.0" y="1550" class="desc" text-anchor="start">draft: formal, casual, decline, agree</text>
<text x="46.0" y="1573" class="cmd" fill="#c49bff">!!voice [-cid n | -gid n] &lt;text&gt;</text>
<text x="58.0" y="1590" class="desc" text-anchor="start">TTS voice note, here or to a saved chat</text>
<text x="46.0" y="1613" class="cmd" fill="#c49bff">!!help</text>
<text x="58.0" y="1630" class="desc" text-anchor="start">this list</text>
<line x1="820.0" y1="1014" x2="820.0" y2="1054" class="edge"/>
<rect x="563.3333333333334" y="1054" width="513.3333333333334" height="654" rx="12" class="card"/>
<rect x="563.3333333333334" y="1054" width="513.3333333333334" height="6" rx="3" fill="#ffd75e"/>
<text x="579.3333333333334" y="1084" class="ctitle" text-anchor="start">Admin · control plane</text>
<text x="579.3333333333334" y="1102" class="csub" text-anchor="start">prefix ! · owner only · run it in the target chat</text>
<text x="579.3333333333334" y="1130" class="sect" text-anchor="start">ALLOWLIST</text>
<text x="579.3333333333334" y="1151" class="cmd" fill="#ffd75e">!add [-g|-c] [jid] [-bid 0-3]</text>
<text x="591.3333333333334" y="1168" class="desc" text-anchor="start">allow this chat/group (default bot 1)</text>
<text x="579.3333333333334" y="1191" class="cmd" fill="#ffd75e">!rm  ·  !edit -bid &lt;n&gt;</text>
<text x="591.3333333333334" y="1208" class="desc" text-anchor="start">remove / reassign; confirm with !YES</text>
<text x="579.3333333333334" y="1231" class="cmd" fill="#ffd75e">!enable  ·  !disable</text>
<text x="591.3333333333334" y="1248" class="desc" text-anchor="start">toggle (or -gid / -cid &lt;id&gt;)</text>
<text x="579.3333333333334" y="1271" class="cmd" fill="#ffd75e">!listgroups  ·  !listchats</text>
<text x="591.3333333333334" y="1288" class="desc" text-anchor="start">what's allowlisted</text>
<text x="579.3333333333334" y="1311" class="cmd" fill="#ffd75e">!findgroups [-f q] [-p n]  ·  !findchats</text>
<text x="591.3333333333334" y="1328" class="desc" text-anchor="start">search joined groups / known chats</text>
<text x="579.3333333333334" y="1352" class="sect" text-anchor="start">ROLES &amp; DKB OPS</text>
<text x="579.3333333333334" y="1373" class="cmd" fill="#ffd75e">!manage mentor -l | -all | -jid &lt;ph&gt; [-rm]</text>
<text x="591.3333333333334" y="1390" class="desc" text-anchor="start">grant / revoke the mentor role</text>
<text x="579.3333333333334" y="1413" class="cmd" fill="#ffd75e">!notify -gid &lt;id&gt; | off</text>
<text x="591.3333333333334" y="1430" class="desc" text-anchor="start">member-join notify group</text>
<text x="579.3333333333334" y="1454" class="sect" text-anchor="start">UTILITIES</text>
<text x="579.3333333333334" y="1475" class="cmd" fill="#ffd75e">!reveal  ·  !reveal!</text>
<text x="591.3333333333334" y="1492" class="desc" text-anchor="start">open a view-once privately / in chat</text>
<text x="579.3333333333334" y="1515" class="cmd" fill="#ffd75e">!remindme &lt;n&gt;[m|h|d] &lt;msg&gt;</text>
<text x="591.3333333333334" y="1532" class="desc" text-anchor="start">quick reminder</text>
<text x="579.3333333333334" y="1555" class="cmd" fill="#ffd75e">!ping  ·  !getjid  ·  !whoami</text>
<text x="591.3333333333334" y="1572" class="desc" text-anchor="start">liveness and JIDs</text>
<text x="579.3333333333334" y="1595" class="cmd" fill="#ffd75e">!setname &lt;jid&gt; &lt;name&gt;  ·  !cleanupnames</text>
<text x="591.3333333333334" y="1612" class="desc" text-anchor="start">fix cached contact names</text>
<text x="579.3333333333334" y="1635" class="cmd" fill="#ffd75e">!neonping  ·  !neonconnect</text>
<text x="591.3333333333334" y="1652" class="desc" text-anchor="start">DB check / hard reconnect</text>
<text x="579.3333333333334" y="1675" class="cmd" fill="#ffd75e">!help -bid &lt;0-3&gt;</text>
<text x="591.3333333333334" y="1692" class="desc" text-anchor="start">any bot's user commands</text>
<line x1="1353.3333333333335" y1="1014" x2="1353.3333333333335" y2="1054" class="edge"/>
<rect x="1096.6666666666667" y="1054" width="513.3333333333334" height="432" rx="12" class="card"/>
<rect x="1096.6666666666667" y="1054" width="513.3333333333334" height="6" rx="3" fill="#9aa4b2"/>
<text x="1112.6666666666667" y="1084" class="ctitle" text-anchor="start">Ops · outside WhatsApp</text>
<text x="1112.6666666666667" y="1102" class="csub" text-anchor="start">HTTP on the health port + the phone host</text>
<text x="1112.6666666666667" y="1130" class="sect" text-anchor="start">HTTP</text>
<text x="1112.6666666666667" y="1151" class="cmd" fill="#9aa4b2">GET /health</text>
<text x="1124.6666666666667" y="1168" class="desc" text-anchor="start">honest liveness: WhatsApp open, DB, watchdog</text>
<text x="1112.6666666666667" y="1191" class="cmd" fill="#9aa4b2">/admin</text>
<text x="1124.6666666666667" y="1208" class="desc" text-anchor="start">dashboard, in-browser QR, allowlist CRUD</text>
<text x="1112.6666666666667" y="1231" class="cmd" fill="#9aa4b2">GET /api/v1/status · groups · chats</text>
<text x="1124.6666666666667" y="1248" class="desc" text-anchor="start">scoped API keys (mhk_...)</text>
<text x="1112.6666666666667" y="1271" class="cmd" fill="#9aa4b2">POST /api/v1/messages</text>
<text x="1124.6666666666667" y="1288" class="desc" text-anchor="start">send a message as the bot</text>
<text x="1112.6666666666667" y="1312" class="sect" text-anchor="start">TERMUX (ANDROID PHONE)</text>
<text x="1112.6666666666667" y="1333" class="cmd" fill="#9aa4b2">botctl.sh start | stop | restart</text>
<text x="1124.6666666666667" y="1350" class="desc" text-anchor="start">tmux session "wabot" + wake-lock</text>
<text x="1112.6666666666667" y="1373" class="cmd" fill="#9aa4b2">botctl.sh status | logs | attach</text>
<text x="1124.6666666666667" y="1390" class="desc" text-anchor="start">watch it run</text>
<text x="1112.6666666666667" y="1413" class="cmd" fill="#9aa4b2">botctl.sh install</text>
<text x="1124.6666666666667" y="1430" class="desc" text-anchor="start">Termux:Boot auto-start, logs ~/boot.log</text>
<text x="1112.6666666666667" y="1453" class="cmd" fill="#9aa4b2">autoupdate.sh</text>
<text x="1124.6666666666667" y="1470" class="desc" text-anchor="start">pulls origin/main and restarts</text>
<text x="1610" y="1738" class="foot" text-anchor="end">Generated from the help texts in agents/*/intro.ts and core/commands/ · Sep 2026</text>
