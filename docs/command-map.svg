<title>MAHORAGA command map</title>
<style>
  .bg{fill:#0f1117}
  .root{fill:#1b1f2e;stroke:#8b9cff;stroke-width:2}
  .card{fill:#171a23;stroke:#2a2f3d;stroke-width:1}
  .edge{fill:none;stroke:#4a5163;stroke-width:1.6}
  text{font-family:'Inter','Segoe UI',Helvetica,Arial,sans-serif}
  .rtitle{font-size:36px;font-weight:800;letter-spacing:10px;fill:#eef1ff}
  .rsub{font-size:14px;fill:#9aa3c7}
  .ctitle{font-size:17px;font-weight:700;fill:#eef1f7}
  .csub{font-size:12px;fill:#8a93a6}
  .sect{font-size:10.5px;font-weight:700;letter-spacing:1.5px;fill:#6b7385}
  .cmd{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace;font-size:13px;font-weight:600}
  .desc{font-size:12.5px;fill:#b3bac8}
  .lane{font-size:13px;font-weight:600;fill:#c9cfdd;letter-spacing:.5px}
